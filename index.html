function openNum(id){const n=S.numbers.find(x=>x.id==id),c=n?n.cid:(S.companies.find(x=>x.on)||{}).id;dlg(`<h3>${n?'تعديل رقم':'رقم جديد'}</h3><label>الاسم</label><input id=fn value="${E(n?.name)}"><label>رقم الهاتف</label><input id=fp inputmode=tel dir=ltr value="${E(n?.phone)}"><label>الشركة</label><select id=fc onchange="pkO()">${opts(S.companies.filter(x=>x.on||x.id==c),c,x=>E(x.name))}</select><label>الباقة</label><select id=fk onchange="pkP()"></select><label>السعر (ج.م)</label><input id=fr type=number min=0 value="${n?last(n.periods).due:''}">${n?'':`<label>تاريخ التفعيل</label><input id=fd type=date value="${today()}">`}<label>ملاحظات</label><textarea id=ft>${E(n?.notes)}</textarea><p class=er id=er></p><div class=bar><button class=b onclick="saveNum(${id||0})">حفظ</button><button class=g onclick="cl()">إلغاء</button></div>`);pkO(n?.pid,!n)}
function pkO(s,pr){const c=$('#fc').value;$('#fk').innerHTML='<option value="">—</option>'+opts(S.packages.filter(p=>p.cid==c&&(p.on||p.id==s)),s,p=>`${E(p.name)} - ${pl(p)} - ${p.price} ج.م`);if(pr)pkP()}
function pkP(){const p=pk($('#fk').value);if(p)$('#fr').value=p.price}
async function saveNum(id){const nm=$('#fn').value.trim(),ph=$('#fp').value.trim(),pr=+$('#fr').value,f=$('#fd');if(!nm||!ph||$('#fr').value===''||pr<0||(f&&!f.value)){$('#er').textContent='راجع البيانات المدخلة';return}const d={name:nm,phone:ph,cid:+$('#fc').value,pid:+$('#fk').value||0,notes:$('#ft').value};if(id){const n=S.numbers.find(x=>x.id==id);Object.assign(n,d);last(n.periods).due=pr}else S.numbers.push({id:nid(),seq:++S.seq,...d,periods:[{start:f.value,due:pr}]});await save();cl();render()}
async function delNum(id){if(confirm('متأكد من الحذف؟ سجلات المدفوعات هتفضل محفوظة.')){S.numbers=S.numbers.filter(n=>n.id!=id);await save();render()}}
async function renew(id){if(!confirm('تأكيد التجديد؟'))return;const n=S.numbers.find(x=>x.id==id),p=pk(n.pid);n.periods.push({start:nextOf(n),due:p?p.price:last(n.periods).due,renewedOn:today()});await save();render()}
async function nren(id){if(!confirm('تأكيد: لم يتم التجديد؟'))return;last(S.numbers.find(x=>x.id==id).periods).not=true;await save();render()}
const MT=['InstaPay','Vodafone Cash','محافظ إلكترونية أخرى','نقدي'];
function openPay(id){const n=S.numbers.find(x=>x.id==id);dlg(`<h3>💰 ${E(n.name)}</h3><label>الفترة</label><select id=yp onchange="payA(${id})">${n.periods.map((p,i)=>`<option value="${i}" ${i==n.periods.length-1?'selected':''}>${p.start} (متبقي ${per(n,p).rem})</option>`).join('')}</select><label>المبلغ</label><input id=ya type=number min=1 value="${per(n,last(n.periods)).rem||''}"><label>طريقة الدفع</label><select id=ym>${MT.map(m=>`<option>${m}</option>`).join('')}</select><label>التاريخ</label><input id=yd type=date value="${today()}"><label>ملاحظات</label><input id=yn><p class=er id=er></p><div class=bar><button class=b onclick="savePay(${id})">حفظ الدفعة</button><button class=g onclick="cl()">إلغاء</button></div><h4>المدفوعات السابقة</h4>${S.payments.filter(x=>x.nid==id).map(x=>`<div class=li><small>${x.date}</small><b style="flex:1">${x.amount} ج.م</b><small>${E(x.method)}</small></div>`).join('')||'<p class=mu>لا توجد</p>'}`)}
function payA(id){const n=S.numbers.find(x=>x.id==id);$('#ya').value=per(n,n.periods[+$('#yp').value]).rem||''}
async function savePay(id){const n=S.numbers.find(x=>x.id==id),p=n.periods[+$('#yp').value],a=+$('#ya').value;if(!(a>0)||a>per(n,p).rem||!$('#yd').value){$('#er').textContent='المبلغ أكبر من المتبقي أو غير صحيح';return}S.payments.push({id:nid(),nid:id,name:n.name,phone:n.phone,start:p.start,amount:a,method:$('#ym').value,date:$('#yd').value,note:$('#yn').value});await save();cl();render()}
function openPk(id){const p=pk(id)||{},c=p.cid||(S.companies.find(x=>x.on)||{}).id;dlg(`<h3>${id?'تعديل باقة':'باقة جديدة'}</h3><label>الشركة</label><select id=kc>${opts(S.companies,c,x=>E(x.name))}</select><label>اسم الباقة</label><input id=kn value="${E(p.name)}"><label>الجيجا</label><input id=kg type=number min=0 value="${p.gb??''}"><label>الدقائق</label><input id=km type=number min=0 value="${p.min??''}"><label>الرسائل (اختياري)</label><input id=ks type=number min=0 value="${p.sms??''}"><label>السعر (ج.م)</label><input id=kp type=number min=0 value="${p.price??''}"><p class=er id=er></p><div class=bar><button class=b onclick="savePk(${id||0})">حفظ</button><button class=g onclick="cl()">إلغاء</button></div>`)}
async function savePk(id){const d={cid:+$('#kc').value,name:$('#kn').value.trim(),gb:+$('#kg').value||0,min:+$('#km').value||0,sms:+$('#ks').value||0,price:+$('#kp').value};if(!d.name||$('#kp').value===''||d.price<0){$('#er').textContent='اكتب الاسم والسعر';return}if(id)Object.assign(pk(id),d);else S.packages.push({id:nid(),on:true,...d});await save();cl();render()}
async function addCo(){const v=$('#nc').value.trim();if(v){S.companies.push({id:nid(),name:v,on:true,color:CL[v]||'#6d8bff'});await save();render()}}
async function renCo(id){const c=cof(id),v=prompt('اسم الشركة',c.name);if(v&&v.trim()){c.name=v.trim();await save();render()}}
function pickLogo(id){LI=id;$('#lf').click()}
function setLogo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),k=Math.min(128/im.width,128/im.height);x.drawImage(im,(128-im.width*k)/2,(128-im.height*k)/2,im.width*k,im.height*k);cof(LI).logo=c.toDataURL('image/png');await save();render()};im.src=r.result};r.readAsDataURL(f)}
async function tog(k,id){const x=S[k].find(y=>y.id==id);x.on=!x.on;await save();render()}
async function delX(k,id){const u=k=='companies'?S.numbers.some(n=>n.cid==id)||S.packages.some(p=>p.cid==id):S.numbers.some(n=>n.pid==id);if(u){alert('مستخدم حاليًا، تقدر توقفه بس.');return}if(confirm('متأكد من الحذف؟')){S[k]=S[k].filter(y=>y.id!=id);await save();render()}}

const bk=()=>dwn('backup-'+today()+'.json',new Blob([JSON.stringify(S)],{type:'application/json'}));
async function rs(f){if(!f||!confirm('هيتم استبدال كل البيانات الحالية. متأكد؟'))return;try{const j=JSON.parse(await f.text());if(!j.numbers||!j.companies)throw 0;S=j;await save();render()}catch{alert('ملف غير صالح')}}
function xl(){if(!window.XLSX){alert('مكتبة Excel تحتاج إنترنت أول مرة');return}const w=XLSX.utils.book_new(),A=(n,a)=>XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(a),n);

A('Payments',[['العميل','الهاتف','الفترة','التاريخ','المبلغ','الطريقة','ملاحظات'],...S.payments.map(x=>[x.name,String(x.phone),x.start,x.date,x.amount,x.method,x.note||''])]);
A('Renewals',[['العميل','الهاتف','بداية الفترة','المطلوب','تاريخ التجديد','لم يتجدد'],...S.numbers.flatMap(n=>n.periods.map(p=>[n.name,String(n.phone),p.start,p.due,p.renewedOn||'',p.not?'Y':'']))]);XLSX.writeFile(w,'Number_Manager.xlsx')}

firebase.initializeApp(FC);const fauth=firebase.auth(),fdb=firebase.firestore();fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let USER=null,READY=0,L={n:{},p:{},m:''},UN=[];

async function save(){const ops=[],mj=mt();if(mj!=L.m){ops.push([fdb.doc('meta/main'),JSON.parse(mj)]);L.m=mj}
const df=(a,c,k)=>{const cur={};a.forEach(x=>{const j=JSON.stringify(x);cur[x.id]=1;if(L[k][x.id]!=j){ops.push([fdb.collection(c).doc(String(x.id)),JSON.parse(j)]);L[k][x.id]=j}});Object.keys(L[k]).forEach(i=>{if(!cur[i]){ops.push([fdb.collection(c).doc(i)]);delete L[k][i]}})};
df(S.numbers,'numbers','n');df(S.payments,'payments','p');for(let i=0;i<ops.length;i+=400){const b=fdb.batch();ops.slice(i,i+400).forEach(o=>o[1]?b.set(o[0],o[1]):b.delete(o[0]));b.commit().catch(e=>console.error(e))}}
