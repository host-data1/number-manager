async function save(){const ops=[],mj=mt();if(mj!=L.m){ops.push([fdb.doc('meta/main'),JSON.parse(mj)]);L.m=mj}
const df=(a,c,k)=>{const cur={};a.forEach(x=>{const j=JSON.stringify(x);cur[x.id]=1;if(L[k][x.id]!=j){ops.push([fdb.collection(c).doc(String(x.id)),JSON.parse(j)]);L[k][x.id]=j}});Object.keys(L[k]).forEach(i=>{if(!cur[i]){ops.push([fdb.collection(c).doc(i)]);delete L[k][i]}})};
df(S.numbers,'numbers','n');df(S.payments,'payments','p');for(let i=0;i<ops.length;i+=400){const b=fdb.batch();ops.slice(i,i+400).forEach(o=>o[1]?b.set(o[0],o[1]):b.delete(o[0]));b.commit().catch(e=>console.error(e))}}
function listen(){const col=(c,k,key)=>fdb.collection(c).onSnapshot(q=>{S[key]=q.docs.map(d=>d.data());L[k]={};S[key].forEach(x=>L[k][x.id]=JSON.stringify(x));render()});
UN=[fdb.doc('meta/main').onSnapshot(async q=>{if(!q.exists){const o=await DB.get();if(o&&o.numbers){const{auth,sync,devices,...r}=o;S={...S,...r}}await save();READY=1;return render()}Object.assign(S,q.data());L.m=mt();READY=1;render()}),col('numbers','n','numbers'),col('payments','p','payments'),fdb.doc('sessions/'+DID).onSnapshot(q=>{if(q.exists&&q.data().kicked){BLK=1;fauth.signOut()}})];setTimeout(beat,2500)}
const MD=()=>localStorage.nmM||'dark',PR=[['#c9a24b','#e6cd8a'],['#3b82f6','#7db1fb'],['#10b981','#6ee7b7'],['#a855f7','#c9a0fa'],['#f43f5e','#fda4af'],['#94a3b8','#cbd5e1']];
function theme(){const r=document.documentElement,a=S.acc;r.dataset.th=MD();['--ac','--a2'].forEach((k,i)=>a?r.style.setProperty(k,a[i]):r.style.removeProperty(k));$('meta[name=theme-color]').content=MD()=='light'?'#f4f3ef':'#0a0c10'}
function tm(m){localStorage.nmM=m||(MD()=='light'?'dark':'light');render()}
async function pc(i){S.acc=i<0?null:PR[i];await save();render()}
async function cc(v){const h=v.slice(1).match(/../g).map(x=>parseInt(x,16));S.acc=[v,'#'+h.map(x=>Math.round(x+(255-x)*.45).toString(16).padStart(2,'0')).join('')];await save();render()}
const dev=()=>{const u=navigator.userAgent,o=/iPhone|iPad/.test(u)?'iPhone':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Linux',b=/Edg/.test(u)?'Edge':/Chrome/.test(u)?'Chrome':/Safari/.test(u)?'Safari':/Firefox/.test(u)?'Firefox':'Browser';return{name:b+' · '+o,type:/Mobi|Android|iPhone|iPad/.test(u)?'Mobile':'Desktop'}};
const beat=()=>{if(USER&&READY&&!document.hidden&&navigator.onLine)fdb.doc('sessions/'+DID).set({...dev(),at:Date.now()},{merge:true}).catch(()=>{})};setInterval(beat,12e4);document.addEventListener('visibilitychange',beat);
const ago=m=>m<36e5?Math.max(1,Math.round(m/6e4))+' دقيقة':m<864e5?Math.round(m/36e5)+' ساعة':Math.round(m/864e5)+' يوم';
function sessList(){const now=Date.now();return[...SD].sort((a,b)=>b.at-a.at).map(x=>{const on=now-x.at<3e5&&!x.kicked,me=x.id==DID;return`<div class=li><span class=ki>${ic(x.type=='Mobile'?'mobile':'desk')}</span><div style="flex:1"><b>${E(x.name)}</b> ${me?bd('هذا الجهاز','ok'):''} ${on?bd('متصل الآن','ok'):x.kicked?bd('محظور','bad'):''}<br><small>${on?'':'آخر ظهور منذ '+ago(now-x.at)}</small></div>${me?'':x.kicked?`<button class=ib onclick="kick('${x.id}',0)">سماح</button>`:`<button class="ib d" onclick="kick('${x.id}',1)">طرد</button>`}</div>`}).join('')||'<p class=mu>لا يوجد</p>'}
function sessWatch(){SU=fdb.collection('sessions').onSnapshot(q=>{SD=q.docs.map(d=>({id:d.id,...d.data()}));const e=$('#sl');if(e)e.innerHTML=sessList()})}
setInterval(()=>{const e=$('#sl');if(e)e.innerHTML=sessList()},3e4);
function kick(id,v){if(v&&!confirm('طرد هذا الجهاز؟'))return;fdb.doc('sessions/'+id).set({kicked:!!v},{merge:true})}
blank();fauth.onAuthStateChanged(u=>{USER=u;UN.forEach(f=>f());UN=[];if(SU){SU();SU=null}READY=0;if(u)listen();else blank();render()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
