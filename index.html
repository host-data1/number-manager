const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>iso(new Date()),dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5),fm=x=>x.toLocaleString('en')+' '+t('egp');

const k=[['total',S.numbers.length],['active',ac],['required',fm(q)],['collected',fm(c)],['unpaidA',fm(un)+' ('+uN+')'],['partA',fm(pt)+' ('+pN+')'],['soon',so],['today',td],['notren',nr]];return`<div class=grid>${k.map(x=>`<div class=c><small>${t(x[0])}</small><b>${x[1]}</b></div>`).join('')}</div>`},
numbers(){return`<div class=bar><input id=q oninput="F.q=this.value;rows()" value="${E(F.q)}" placeholder="${t('search')}"><select onchange="F.co=this.value;F.pk='';render()"><option value="">${t('company')}: ${t('all')}</option>${opts(S.companies,F.co,c=>E(c.name))}</select><select onchange="F.pk=this.value;rows()"><option value="">${t('package')}: ${t('all')}</option>${opts(S.packages.filter(p=>!F.co||p.cid==F.co),F.pk,p=>E(p.name))}</select><button onclick="openNum(0)">+ ${t('add')}</button></div><div class=tw><table><thead><tr>${['#','name','phone','company','package','price','activated','next','renewal','pay',''].map(h=>`<th>${h=='#'||!h?h:t(h)}</th>`).join('')}</tr></thead><tbody id=tb></tbody></table></div>`},

function openNum(id){const n=S.numbers.find(x=>x.id==id),c=n?n.cid:(S.companies.find(x=>x.on)||{}).id;dlg(`<h3>${t(n?'edit':'add')}</h3><label>${t('name')}</label><input id=fn value="${E(n?.name)}"><label>${t('phone')}</label><input id=fp inputmode=tel dir=ltr value="${E(n?.phone)}"><label>${t('company')}</label><select id=fc onchange="pkO()">${opts(S.companies.filter(x=>x.on||x.id==c),c,x=>E(x.name))}</select><label>${t('package')}</label><select id=fk onchange="pkP()"></select><label>${t('price')}</label><input id=fr type=number min=0 value="${n?last(n.periods).due:''}">${n?'':`<label>${t('activated')}</label><input id=fd type=date value="${today()}">`}<label>${t('notes')}</label><textarea id=ft>${E(n?.notes)}</textarea><p class=er id=er></p><div class=bar><button onclick="saveNum(${id||0})">${t('save')}</button><button class=g onclick="cl()">${t('cancel')}</button></div>`);pkO(n?.pid,!n)}
